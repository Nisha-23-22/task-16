<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top bar -->
    <div class="topbar">
        <p class="greeting">Hi, Nisha Yadav</p>
        <button class="login-btn" type="button">Login</button>
    </div>

    <!-- Search section -->
    <div class="search-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Student" autocomplete="off">
        </div>
        <button class="search-btn" id="searchBtn" type="button">Search</button>
    </div>

    <!-- Student cards are rendered here by script.js -->
    <div class="cards" id="studentCards"></div>

    <script src="script.js"></script>
</body>
</html>
